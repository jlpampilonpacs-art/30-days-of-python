{% extends 'layout.html' %} {% block content %}
<div class="join-m-container">
    <form id = "form-id" action="{{url_for('join')}}" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="name">Name: </label>
                <br>
                <input type="text" id="name" class="form-control" name="name" placeholder="Name"  required>
                <br>
            </div>
            <div class="form-group">
                <label for="bday">Date of Birth: </label>
                <br>
                <input type="date" id="bday" class="form-control" name="bday" required>
                <br>
            </div>
            <div class="form-group">
                <label for="country">Country: </label>
                <br>
                <input type="text" id="country" class="form-control" name="country" placeholder="Country"  required>
                <br>
            </div>
            <div class="form-group">
                <label for="city">City: </label>
                <br>
                <input type="text" id="city" class="form-control" name="city" placeholder="City"  required>
                <br>
            </div>
            <div class="form-group">
                <label for="skills">Skills: </label>
                <br>
                <textarea rows="5" id="skills" class="form-control" name="skills" placeholder="Skills seperated by comma" required></textarea>
                <br>
            </div>
            <div class="form-group">
                <label for="bio">Bio: </label>
                <br>
                <textarea rows="5" id="bio" class="form-control" name="bio" required></textarea>
                <br>
            </div>
            <div class="form-group">
                <button type="submit" id= "submit-btn" class="btn">Add Student</button>
            </div>
        </div>
    </form>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var form = document.getElementById('form-id');
        var btn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            btn.innerText = 'Successfully Added!';
            btn.style.backgroundColor = '#2ecc71';
            btn.style.color = '#ffffff';
            btn.disabled = true; // Prevents double-clicking while waiting

            setTimeout(function() {
                form.submit();
            }, 1500);
        });
    });
</script>

{% endblock %}
